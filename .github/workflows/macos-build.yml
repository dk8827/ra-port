name: macOS build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja pkg-config sdl2

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --target redalert_mac lan_udp_test lan_packet_test -j 3

      - name: Test
        run: |
          ./build/lan_udp_test
          ./build/lan_packet_test
          tests/run_script_tests.sh
